name: Release UPM package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Scan public files for secrets
        run: bash scripts/scan-secrets.sh

      - name: Validate tag and package
        run: |
          set -euo pipefail
          version="$(node -p "require('./Packages/com.tik-choco.mistlib/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          bash scripts/validate-package.sh

      - name: Build immutable package tarball
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd Packages/com.tik-choco.mistlib && npm pack --ignore-scripts --pack-destination ../../dist)
          sha256sum dist/*.tgz > dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: com.tik-choco.mistlib-${{ github.ref_name }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: com.tik-choco.mistlib-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tgz
            dist/SHA256SUMS
